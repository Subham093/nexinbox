name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      
      # Catches syntax errors, missing imports, etc. BEFORE Render deploys.
      - name: Check that core modules import successfully
        run: |
          python -c "import ai"
          python -c "import gmail"
          python -c "import auth"
          python -c "import database"
          python -c "import main"
        env:
          GROQ_API_KEY: dummy_key_for_ci
          GOOGLE_CLIENT_ID: dummy_client_id
          GOOGLE_CLIENT_SECRET: dummy_secret
          SECRET_KEY: dummy_secret_key
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      # Run pytest for real — no more silently swallowing failures.
      # If a test breaks, this step (and the whole workflow) now fails.
      - name: Run tests
        run: pytest --continue-on-collection-errors -v